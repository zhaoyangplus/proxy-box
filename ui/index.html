<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Proxy Box</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23103222' width='16' height='16' rx='3'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="nodes.css" />
<link rel="stylesheet" href="subs.css" />
</head>
<body>
<div class="pb-app">
  <aside class="pb-side">
    <div class="pb-brand">
      <svg class="pb-logo" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#1e5239"/>
        <rect x="7" y="7" width="18" height="18" rx="5" fill="none" stroke="#c4f269" stroke-width="2"/>
        <circle cx="16" cy="16" r="3" fill="#c4f269"/>
      </svg>
      <div>
        <div class="pb-brand-name">Proxy Box</div>
        <button type="button" class="pb-version" id="pb-version" aria-label="检查更新">
          <span id="pb-version-text">…</span>
          <span class="pb-dot" id="pb-version-dot" hidden></span>
        </button>
      </div>
    </div>
    <nav class="pb-nav" id="pb-nav" aria-label="页面"></nav>
    <div class="pb-mini">
      <div class="pb-mini-row">
        <span class="pb-light pb-light-off" id="pb-core-light"></span>
        <span id="pb-core-word">已停止</span>
      </div>
      <div class="pb-mini-row">
        <span id="pb-mode-word">规则</span>
        <span class="pb-badge pb-badge-muted" id="pb-sys-badge">系统代理 关</span>
      </div>
      <button type="button" class="pb-btn pb-btn-ghost pb-btn-sm" id="pb-open-home">打开 ~/.proxy-box</button>
    </div>
  </aside>
  <div class="pb-main">
    <header class="pb-head">
      <div class="pb-head-text">
        <h1 id="pb-title">总览</h1>
        <p id="pb-sub">内核、双通道出口和常用开关</p>
      </div>
      <div class="pb-actions" id="pb-actions"></div>
    </header>
    <div class="pb-content" id="pb-content">
      <section id="tab-overview" class="pb-tab" aria-label="总览"></section>
      <section id="tab-nodes" class="pb-tab" aria-label="代理节点" hidden></section>
      <section id="tab-subs" class="pb-tab" aria-label="订阅管理" hidden></section>
      <section id="tab-tools" class="pb-tab" aria-label="AI 工具" hidden></section>
      <section id="tab-diag" class="pb-tab" aria-label="连接诊断" hidden></section>
      <section id="tab-settings" class="pb-tab" aria-label="设置" hidden></section>
    </div>
  </div>
</div>

<div class="pb-toast" id="pb-toast" role="status" aria-live="polite" hidden></div>

<div class="pb-modal" id="pb-update" hidden>
  <div class="pb-modal-backdrop" id="pb-update-backdrop"></div>
  <div class="pb-modal-card" role="dialog" aria-modal="true" aria-labelledby="pb-update-title">
    <div class="pb-modal-head">
      <h2 id="pb-update-title">检查更新</h2>
      <button type="button" class="pb-btn pb-btn-ghost pb-btn-sm" id="pb-update-close">关闭</button>
    </div>
    <p class="pb-muted" id="pb-update-caption"></p>
    <div class="pb-update-flow" id="pb-update-flow"></div>
    <span class="pb-badge pb-badge-muted" id="pb-update-pill"></span>
    <p class="pb-muted" id="pb-update-meta"></p>
    <pre class="pb-notes" id="pb-update-notes"></pre>
    <div class="pb-progress" id="pb-update-progress" hidden><span id="pb-update-bar"></span></div>
    <p class="pb-muted" id="pb-update-msg"></p>
    <p class="pb-mono" id="pb-update-bytes"></p>
    <div class="pb-modal-actions">
      <button type="button" class="pb-btn pb-btn-ghost" id="pb-update-releases">打开发布页</button>
      <button type="button" class="pb-btn" id="pb-update-recheck">重新检查</button>
      <button type="button" class="pb-btn pb-btn-primary" id="pb-update-apply" hidden>立即更新并重启</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="tab-overview.js"></script>
<script src="tab-tools.js"></script>
<script src="nodes.js"></script>
<script src="subs.js"></script>
</body>
</html>
