<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Proxy Box</title>
<script>
(function () {
  var theme = "auto";
  try {
    var saved = localStorage.getItem("pb-v22-theme");
    if (saved === "light" || saved === "dark" || saved === "auto") theme = saved;
  } catch (err) {}
  var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
})();
</script>

<div class="app" id="app">
  <aside class="side glass" id="side">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 32 32"><rect x="7" y="7" width="18" height="18" rx="5" fill="none" stroke="#c4f269" stroke-width="2.4"/><circle cx="16" cy="16" r="3.2" fill="#c4f269"/></svg>
      </div>
      <div class="brand-txt">
        <div class="brand-name">Proxy Box</div>
        <button type="button" class="ver" id="verBtn" title="检查更新"><span id="verText">…</span><span class="ver-dot" id="verDot" hidden></span></button>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="主导航">
      <span class="nav-ind" id="navInd" aria-hidden="true"></span>
      <button type="button" class="nav-item is-active" data-tab="overview" aria-current="page" title="总览  Ctrl+1"><svg class="i"><use href="#i-home"/></svg><span class="lbl">总览</span><span class="nav-badge" data-nb="overview" hidden></span></button>
      <button type="button" class="nav-item" data-tab="nodes" aria-current="false" title="代理节点  Ctrl+2"><svg class="i"><use href="#i-globe"/></svg><span class="lbl">代理节点</span><span class="nav-badge" data-nb="nodes" hidden></span></button>
      <button type="button" class="nav-item" data-tab="subs" aria-current="false" title="订阅管理  Ctrl+3"><svg class="i"><use href="#i-layers"/></svg><span class="lbl">订阅管理</span><span class="nav-badge" data-nb="subs" hidden></span></button>
      <button type="button" class="nav-item" data-tab="tools" aria-current="false" title="AI 工具  Ctrl+4"><svg class="i"><use href="#i-sparkle"/></svg><span class="lbl">AI 工具</span><span class="nav-badge" data-nb="tools" hidden></span></button>
      <button type="button" class="nav-item" data-tab="diag" aria-current="false" title="连接诊断  Ctrl+5"><svg class="i"><use href="#i-pulse"/></svg><span class="lbl">连接诊断</span><span class="nav-badge" data-nb="diag" hidden></span></button>
      <button type="button" class="nav-item" data-tab="settings" aria-current="false" title="设置  Ctrl+6"><svg class="i"><use href="#i-gear"/></svg><span class="lbl">设置</span><span class="nav-badge" data-nb="settings" hidden></span></button>
    </nav>

    <div class="side-foot">
      <button type="button" class="status" id="sideStatus" title="前往总览">
        <span class="status-top"><span class="pulse off" id="sideDot"></span><span id="sideCore">内核已停止</span></span>
        <span class="status-chips"><span class="mchip" id="sideMode">规则分流</span><span class="mchip" id="sideSys">系统代理 关</span></span>
      </button>
      <div class="side-tools">
        <button type="button" class="btn sm plain grow" id="sideHome" title="在资源管理器中打开 ~/.proxy-box"><svg class="i"><use href="#i-folder"/></svg><span class="lbl">~/.proxy-box</span></button>
        <button type="button" class="btn sm icon plain" id="sideTheme" title="切换浅色 / 深色"><svg class="i" aria-hidden="true"><use href="#i-sun"/></svg></button>
      </div>
    </div>
  </aside>

  <main class="main" id="main" data-ch="daily">
    <div class="scroll" id="scroll"><div class="page" id="page"></div></div>
    <header class="topbar glass" id="topbar">
      <div class="tb-row">
        <div class="tb-titles"><h1 class="tb-title" id="tbTitle">总览</h1><p class="tb-sub" id="tbSub"></p></div>
        <div class="tb-actions" id="tbActions"></div>
      </div>
      <div class="tb-acc" id="tbAcc" hidden></div>
    </header>
    <div class="toast glass" id="toast" role="status" aria-live="polite" hidden></div>
  </main>
</div>

<div class="pop glass" id="pop" hidden></div>
<div class="sheet-wrap" id="sheet" hidden><div class="sheet glass" id="sheetCard" role="dialog" aria-modal="true"></div></div>

<script src="util.js"></script>
<script src="app.js"></script>
<script src="tab-overview.js"></script>
<script src="nodes-filter.js"></script>
<script src="nodes.js"></script>
<script src="subs-logic.js"></script>
<script src="subs.js"></script>
<script src="tools-logic.js"></script>
<script src="tab-tools.js"></script>
<script src="diag-logic.js"></script>
<script src="tab-diag.js"></script>
<script src="tab-settings.js"></script>
<script src="update.js"></script>
</body>
</html>
