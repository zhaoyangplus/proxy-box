mixed-port: 27890
allow-lan: false
bind-address: '127.0.0.1'
mode: rule
find-process-mode: always
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 30
external-controller: '127.0.0.1:27891'
secret: 's3cret'
dns:
  enable: false
profile:
  store-selected: true
listeners:
  - name: 'proxybox-ai-dedicated'
    type: mixed
    port: 27892
    listen: '127.0.0.1'
    udp: true
    proxy: '🤖 AI-IDE'
  - name: 'proxybox-speedtest'
    type: mixed
    port: 27893
    listen: '127.0.0.1'
    udp: false
    proxy: '🧪 SPEEDTEST'
proxy-providers:
  'alpha':
    type: file
    path: providers/alpha.txt
    filter: '(?i)美国|Japan'
proxy-groups:
  - name: 'PROXY'
    type: select
    proxies:
      - '⚡ AUTO'
      - 'DIRECT'
    use:
      - 'alpha'
    exclude-filter: '(?i)剩余|流量|到期|官网|套餐|重置|订阅|网址|失联|群|邀请|距离|下次|说明|过期|维护|故障|通知'
  - name: '⚡ AUTO'
    type: url-test
    use:
      - 'alpha'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    exclude-filter: '(?i)剩余|流量|到期|官网|套餐|重置|订阅|网址|失联|群|邀请|距离|下次|说明|过期|维护|故障|通知'
  - name: '🤖 AI-IDE'
    type: select
    proxies:
      - '⚡ AI-Auto'
    use:
      - 'alpha'
    exclude-filter: '(?i)香港|🇭🇰|Hong Kong|港\d|hktj|hkbn|hkt|澳门|🇲🇴|Macau|中国|大陆|🇨🇳|China|俄罗斯|🇷🇺|Russia|(^|[^a-z])(hk|mo|cn|ru)([^a-z]|$)|剩余|流量|到期|官网|套餐|重置|订阅|网址'
  - name: '⚡ AI-Auto'
    type: url-test
    use:
      - 'alpha'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    exclude-filter: '(?i)香港|🇭🇰|Hong Kong|港\d|hktj|hkbn|hkt|澳门|🇲🇴|Macau|中国|大陆|🇨🇳|China|俄罗斯|🇷🇺|Russia|(^|[^a-z])(hk|mo|cn|ru)([^a-z]|$)|剩余|流量|到期|官网|套餐|重置|订阅|网址'
  - name: '🧪 SPEEDTEST'
    type: select
    proxies:
      - 'DIRECT'
    use:
      - 'alpha'
    exclude-filter: '(?i)剩余|流量|到期|官网|套餐|重置|订阅|网址|失联|群|邀请|距离|下次|说明|过期|维护|故障|通知'
rules:
  - 'IP-CIDR,127.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR6,::1/128,DIRECT,no-resolve'
  - 'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,172.16.0.0/12,DIRECT,no-resolve'
  - 'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve'
  - 'PROCESS-NAME,ProxyBox.exe,🤖 AI-IDE'
  - 'MATCH,PROXY'
